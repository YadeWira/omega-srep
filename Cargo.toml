# Rust workspace for the Omega SREP port.
#
# The C++ implementation stays the reference oracle while modules are
# ported one at a time; crates/osrep-conformance runs both and diffs the
# results, so every ported module is checked against the shipped binary
# rather than against a second reading of the spec.
#
# `license` is deliberately unset, and that is a settled decision rather than
# a pending one: the C++ core is Bulat Ziganshin's ("All rights reserved", with
# a commercial-licence offer), the port is a faithful translation of it, and the
# owner's call (2026-09-18) is to ship on that footing without claiming a licence
# the tree cannot grant. Adding one needs his permission first -- see
# "Licence -- decided" in docs/rust-port.md before touching this.

[workspace]
resolver = "2"
members = [
    "crates/osrep-core",
    "crates/osrep-cli",
    "crates/osrep-conformance",
]

# Was kept in step with `program_version` in Compression/SREP/srep.cpp, back
# when the two binaries were meant to report the same version line. From 2.0.0
# they diverge on purpose: the Rust `osrep` writes the v5 container by default,
# which the C++ cannot read, so they are no longer interchangeable and pretending
# otherwise in `--version` would be a lie. srep.cpp stays at 1.0.7 -- the last
# release the C++ actually shipped in.
[workspace.package]
version = "2.0.1"
edition = "2021"
rust-version = "1.77"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The C++ release build uses -O3 -flto; keep the profiles comparable so
# conformance runs do not hide a divergence behind different inlining.
[profile.dev]
opt-level = 1
