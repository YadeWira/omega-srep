name: macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [osrep]

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: brew install fpc
      - name: Toolchain
        run: |
          fpc -iV
          cc --version | head -1
      - name: Native CDC and match finder vs Pascal
        run: |
          bash tests/native_cdc.sh
          bash tests/native_match.sh
      - name: v6 reader and writer
        run: |
          bash tests/v6_read.sh
          bash tests/v6_encode.sh
      - name: Long range (-m6, format v7) and the frozen v7 fixtures
        run: bash tests/v7_longrange.sh
      - name: Embeddable -m6 API (osrep_m6) against the CLI
        run: bash tests/osrep_m6.sh
      - name: Memory budget
        run: bash tests/memory_budget.sh
      - name: Block-wise decoder
        run: bash tests/decode_blockwise.sh
      - name: zpaq CDC vectors
        run: bash tests/zpaq_cdc_vectors.sh
      - name: SHA-1 and exact fragments
        run: |
          bash tests/sha1.sh
          bash tests/zpaq_fragments_exact.sh
          bash tests/osrep_cdc_mode.sh
      - name: OREP (round trips, native == reference, corrupt streams)
        run: |
          bash scripts/build_orep.sh build/orep
          bash tests/orep.sh build/orep
          mkdir -p build/macos
          cp build/orep/orep build/macos/orep
      - name: Build the release binary
        run: |
          mkdir -p build/macos/obj build/macos/units
          for f in osrep_cdc osrep_match osrep_lr osrep_vhash_nh osrep_crc_native; do
            cc -O3 -fPIC -fno-builtin -fno-stack-protector \
              -c "src/c/$f.c" -o "build/macos/obj/$f.o"
          done
          fpc -Mobjfpc -O2 -Sh -Xs -Fu./src/pascal \
            -Fo./build/macos/obj -FU./build/macos/units -FE./build/macos \
            -o./build/macos/osrep ./src/pascal/osrep.lpr
          build/macos/osrep --version
          file build/macos/osrep
      - uses: actions/upload-artifact@v4
        with:
          name: osrep-macos-arm64
          path: |
            build/macos/osrep
            build/macos/orep
